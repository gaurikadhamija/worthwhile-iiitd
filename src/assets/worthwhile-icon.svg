<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <!-- Wine gradient for the W letterform -->
    <linearGradient id="wwWineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F2437" />
      <stop offset="50%" stop-color="#551D2C" />
      <stop offset="100%" stop-color="#3A111C" />
    </linearGradient>

    <!-- Path warm cream gradient -->
    <linearGradient id="wwPathGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DECBB3" />
      <stop offset="70%" stop-color="#EFE3D3" />
      <stop offset="100%" stop-color="#FFFDF8" />
    </linearGradient>

    <!-- Subtle drop shadow for pin -->
    <filter id="wwPinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#240B12" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 3 Golden Sunburst Rays at the Top -->
  <g stroke="#B78A4A" stroke-width="3" stroke-linecap="round">
    <!-- Center ray -->
    <line x1="50" y1="4" x2="50" y2="12" />
    <!-- Left ray -->
    <line x1="37" y1="8" x2="43" y2="15" />
    <!-- Right ray -->
    <line x1="63" y1="8" x2="57" y2="15" />
  </g>

  <!-- The Bold Serif 'W' Letterform -->
  <!-- Left Wing of W -->
  <path d="M12 28 C16 28 20 27 20 24 L20 22 L35 22 L35 24 C35 27 38 28 42 28 L30 76 L18 28 Z" fill="url(#wwWineGrad)" />
  <polygon points="17,25 25,25 35,76 27,76" fill="url(#wwWineGrad)" />
  
  <!-- Right Wing of W -->
  <path d="M58 28 C62 28 65 27 65 24 L65 22 L82 22 L82 24 C82 27 85 28 88 28 L74 76 L62 28 Z" fill="url(#wwWineGrad)" />
  <polygon points="63,25 75,25 83,76 75,76" fill="url(#wwWineGrad)" />

  <!-- Center Peaks of W -->
  <polygon points="32,76 50,34 54,34 70,76 60,76 50,48 40,76" fill="url(#wwWineGrad)" />

  <!-- Stylized Elegant W Silhouette (Unified Master Shape) -->
  <path d="M16 24 H30 L40 68 L50 36 L60 68 L70 24 H84 L71 78 C70 80 67 81 64 81 C61 81 58 79 57 76 L50 56 L43 76 C42 79 39 81 36 81 C33 81 30 80 29 78 Z" fill="url(#wwWineGrad)" />

  <!-- The Winding Campus Pathway ascending through the center of the W -->
  <path d="M37 81 C42 81 48 76 50 64 C52 53 49 46 50 38 C51 46 54 55 52 65 C50 75 44 81 37 81 Z" fill="url(#wwPathGrad)" opacity="0.95" />
  <path d="M36 81 C44 80 49 71 50 54 C51 44 49 39 50 36 C52 40 54 48 53 58 C51 72 46 80 36 81 Z" fill="#F4EBDD" />

  <!-- Location Map Pin / Beacon at Summit -->
  <g filter="url(#wwPinShadow)">
    <!-- Pin Body (Teardrop pointing down) -->
    <path d="M50 16 C43.5 16 38.5 21 38.5 27.5 C38.5 34 46.5 44 50 47.5 C53.5 44 61.5 34 61.5 27.5 C61.5 21 56.5 16 50 16 Z" fill="url(#wwWineGrad)" stroke="#FFFDF8" stroke-width="1.5" />
    <!-- Pin Inner Aperture / Dot -->
    <circle cx="50" cy="27" r="4.2" fill="#FFFDF8" />
  </g>
</svg>
